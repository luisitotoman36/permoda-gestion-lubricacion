services:
  - type: web
    name: permoda-backend
    env: docker
    branch: main
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        value: "REPLACE_WITH_STRONG_SECRET"
      - key: USE_SQLITE
        value: "false"
      - key: DATABASE_URL
        value: "postgres://USER:PASS@HOST:5432/DBNAME"
      - key: UPLOAD_DIR
        value: "/tmp/uploads"
